<!doctype html>
<html lang="en">
<!--
    This file is derived from the reveal.js Markdown example.  This file is
    intended to be served from wherever you run a "reveal.js" server.  It
    assumes "manta-tools.md" is in the same directory.
-->
<head>
    <meta charset="utf-8">
    <title>Manta Tools</title>
    <link rel="stylesheet" href="../dist/reveal.css">
    <link rel="stylesheet" href="../dist/theme/black.css" id="theme">
    <link rel="stylesheet" href="../plugin/highlight/zenburn.css">
</head>

<body>
    <div class="reveal">
        <div class="slides">
            <!-- Use external markdown resource, separate slides by three newlines; vertical slides by two newlines -->
            <section data-markdown="manta-tools.md" data-separator="^\n\n\n" data-separator-vertical="^\n\n"></section>
        </div>
    </div>

    <script src="../dist/reveal.js"></script>
    <script src="../plugin/markdown/markdown.js"></script>
    <script src="../plugin/highlight/highlight.js"></script>
    <script src="../plugin/notes/notes.js"></script>
    <script src="../plugin/math/math.js"></script>

    <script>

            Reveal.initialize({
                    controls: true,
                    progress: true,
                    history: true,
                    center: true,

                    plugins: [ RevealMarkdown, RevealNotes, RevealMath.KaTeX ]
            });

    </script>
</body>
</html>
